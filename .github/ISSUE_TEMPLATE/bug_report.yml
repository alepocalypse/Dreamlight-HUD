name: Bug report
description: The HUD shows something wrong or does not work
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: What did you expect, and what did the HUD show instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Which tab, Villager, Companion, or event? Screenshots help.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows exe, Windows from source, Linux, macOS]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release number or commit
  - type: markdown
    attributes:
      value: Please do not attach your raw save file or profile.json.
