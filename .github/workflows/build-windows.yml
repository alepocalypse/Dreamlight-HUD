name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller cryptography pywebview
      - run: python -m unittest discover -s tests
      - run: >
          pyinstaller --onefile --noconsole --name DreamlightHUD
          --add-data "ddvhud/static;ddvhud/static" ddvhud_win.py
      - uses: actions/upload-artifact@v4
        with:
          name: DreamlightHUD-windows
          path: dist/DreamlightHUD.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DreamlightHUD.exe
